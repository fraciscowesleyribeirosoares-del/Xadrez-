<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez 3D com IA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0a0c12;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(18, 22, 34, 0.85);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            align-items: center;
            z-index: 10;
            max-width: 95vw;
        }

        select, button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-active {
            background: #00f5d4 !important;
            color: #0a0c12 !important;
            font-weight: bold;
        }

        #status {
            font-size: 12px;
            font-weight: 600;
            color: #00f5d4;
            margin: 0 2px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <button id="btn-white" class="btn-active">Brancas</button>
        <button id="btn-black">Pretas</button>
        <select id="difficulty">
            <option value="easy">Fácil</option>
            <option value="medium" selected>Médio</option>
            <option value="hard">Difícil</option>
        </select>
        <span id="status">Sua vez</span>
        <button id="reset-btn">Reiniciar</button>
    </div>

    <div id="canvas-container"></div>

    <!-- LIBs Estáveis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let game, scene, camera, renderer, controls;
        let boardMeshGroup, piecesGroup;
        let playerColor = 'w';
        let selectedSquare = null;
        let highlightedSquares = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const lightSquareMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.2, metalness: 0.1 });
        const darkSquareMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
        const whitePieceMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.1, metalness: 0.1 });
        const blackPieceMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.3, metalness: 0.2 });
        const highlightMat = new THREE.MeshBasicMaterial({ color: 0x00f5d4, transparent: true, opacity: 0.6 });

        function coordsToSquare(col, row) {
            return ['a','b','c','d','e','f','g','h'][col] + (8 - row);
        }

        function squareToCoords(square) {
            return { col: square.charCodeAt(0) - 97, row: 8 - parseInt(square[1]) };
        }

        function coordsToVector(col, row) {
            return new THREE.Vector3(col - 3.5, 0, row - 3.5);
        }

        function updateCamera() {
            if (playerColor === 'w') {
                camera.position.set(0, 18, 16);
            } else {
                camera.position.set(0, 18, -16);
            }
            controls.target.set(0, 0, 0);
            controls.update();
        }

        function createEnvironment() {
            // Criação do céu procedural em gradiente
            const canvas = document.createElement('canvas');
            canvas.width = 2;
            canvas.height = 512;
            const context = canvas.getContext('2d');
            const gradient = context.createLinearGradient(0, 0, 0, 512);
            
            gradient.addColorStop(0.0, '#050714'); // Topo do céu (noite profunda)
            gradient.addColorStop(0.4, '#1a1b41'); // Azul intermediário
            gradient.addColorStop(0.7, '#432371'); // Pôr do sol roxo
            gradient.addColorStop(0.9, '#faae7b'); // Horizon aquecido
            gradient.addColorStop(1.0, '#2b1055'); // Linha do horizonte
            
            context.fillStyle = gradient;
            context.fillRect(0, 0, 2, 512);

            const texture = new THREE.CanvasTexture(canvas);
            const skyGeo = new THREE.SphereGeometry(100, 32, 15);
            const skyMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
            const sky = new THREE.Mesh(skyGeo, skyMat);
            scene.add(sky);

            // Adiciona Estrelas no Céu
            const starsGeo = new THREE.BufferGeometry();
            const starsCount = 400;
            const starPositions = new Float32Array(starsCount * 3);

            for(let i = 0; i < starsCount * 3; i += 3) {
                starPositions[i] = (Math.random() - 0.5) * 160;
                starPositions[i+1] = Math.random() * 50 + 10;
                starPositions[i+2] = (Math.random() - 0.5) * 160;
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0.8 });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);
        }

        function createBoard() {
            boardMeshGroup.clear();
            const squareGeo = new THREE.BoxGeometry(1, 0.1, 1);
            
            for (let col = 0; col < 8; col++) {
                for (let row = 0; row < 8; row++) {
                    const isLight = (col + row) % 2 === 0;
                    const tile = new THREE.Mesh(squareGeo, isLight ? lightSquareMat : darkSquareMat);
                    tile.position.set(col - 3.5, 0, row - 3.5);
                    tile.receiveShadow = true;
                    tile.userData = { square: coordsToSquare(col, row) };
                    boardMeshGroup.add(tile);
                }
            }
        }

        function createPieceGeometry(type) {
            const group = new THREE.Group();
            
            const baseBottom = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.36, 0.06, 24));
            baseBottom.position.y = 0.03;
            const baseTop = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.06, 24));
            baseTop.position.y = 0.09;
            group.add(baseBottom, baseTop);

            switch (type.toLowerCase()) {
                case 'p': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.24, 0.3, 20));
                    body.position.y = 0.27;
                    const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.04, 20));
                    ring.position.y = 0.43;
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 20));
                    head.position.y = 0.54;
                    group.add(body, ring, head);
                    break;
                }
                case 'r': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.26, 0.42, 20));
                    body.position.y = 0.33;
                    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.24, 0.12, 20));
                    rim.position.y = 0.58;
                    group.add(body, rim);
                    for (let i = 0; i < 4; i++) {
                        const battlement = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.08));
                        const angle = (i * Math.PI) / 2;
                        battlement.position.set(Math.cos(angle) * 0.2, 0.66, Math.sin(angle) * 0.2);
                        group.add(battlement);
                    }
                    break;
                }
                case 'n': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 0.25, 20));
                    body.position.y = 0.245;
                    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16));
                    chest.scale.set(0.75, 1.25, 1.1);
                    chest.position.set(0, 0.44, 0.02);
                    const head = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.18, 0.28));
                    head.position.set(0, 0.55, 0.1);
                    head.rotation.x = 0.3;
                    group.add(body, chest, head);
                    break;
                }
                case 'b': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.25, 0.42, 20));
                    body.position.y = 0.33;
                    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.16, 0.05, 20));
                    collar.position.y = 0.55;
                    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 20, 20));
                    head.scale.set(1, 1.3, 1);
                    head.position.y = 0.68;
                    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.04, 12, 12));
                    tip.position.y = 0.88;
                    group.add(body, collar, head, tip);
                    break;
                }
                case 'q': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.27, 0.52, 20));
                    body.position.y = 0.38;
                    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.17, 0.06, 20));
                    collar.position.y = 0.66;
                    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.16, 0.18, 16));
                    crown.position.y = 0.77;
                    const orb = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12));
                    orb.position.y = 0.89;
                    group.add(body, collar, crown, orb);
                    break;
                }
                case 'k': {
                    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.28, 0.55, 20));
                    body.position.y = 0.395;
                    const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.18, 0.06, 20));
                    collar.position.y = 0.69;
                    const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.18, 0.18, 16));
                    crown.position.y = 0.80;
                    const crossV = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.16, 0.05));
                    crossV.position.y = 0.95;
                    const crossH = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.05, 0.05));
                    crossH.position.y = 0.97;
                    group.add(body, collar, crown, crossV, crossH);
                    break;
                }
            }

            group.traverse(child => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            return group;
        }

        function renderPieces() {
            while (piecesGroup.children.length > 0) {
                piecesGroup.remove(piecesGroup.children[0]);
            }

            const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const group = createPieceGeometry(piece.type);
                        const mat = piece.color === 'w' ? whitePieceMat : blackPieceMat;
                        group.traverse(child => { if (child.isMesh) child.material = mat; });
                        const pos = coordsToVector(c, r);
                        group.position.set(pos.x, 0.05, pos.z);
                        group.userData = { square: coordsToSquare(c, r) };
                        piecesGroup.add(group);
                    }
                }
            }
        }

        function highlightMoves(square) {
            clearHighlights();
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                const coords = squareToCoords(move.to);
                const mesh = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.4, 16), highlightMat);
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.set(coords.col - 3.5, 0.06, coords.row - 3.5);
                scene.add(mesh);
                highlightedSquares.push(mesh);
            });
        }

        function clearHighlights() {
            highlightedSquares.forEach(m => scene.remove(m));
            highlightedSquares = [];
        }

        function makeAIMove() {
            if (game.game_over() || game.turn() === playerColor) return;
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            const selectedMove = moves[Math.floor(Math.random() * moves.length)];
            game.move(selectedMove);
            renderPieces();
            updateStatus();
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (game.in_checkmate()) {
                statusEl.innerText = game.turn() === playerColor ? 'IA Venceu!' : 'Você Venceu!';
            } else if (game.in_draw()) {
                statusEl.innerText = 'Empate!';
            } else {
                statusEl.innerText = game.turn() === playerColor ? 'Sua vez' : 'IA pensando...';
            }
        }

        function resetGame() {
            game.reset();
            clearHighlights();
            selectedSquare = null;
            updateCamera();
            renderPieces();
            updateStatus();

            if (playerColor === 'b') {
                setTimeout(makeAIMove, 400);
            }
        }

        function init() {
            game = new Chess();
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;

            // Luzes ajustadas para a paisagem
            const ambientLight = new THREE.AmbientLight(0xffdfc4, 0.6);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffe8d6, 0.9);
            mainLight.position.set(6, 14, 8);
            mainLight.castShadow = true;
            scene.add(mainLight);

            const fillLight = new THREE.DirectionalLight(0x7b2cbf, 0.4);
            fillLight.position.set(-8, 8, -8);
            scene.add(fillLight);

            createEnvironment();

            // Mesa
            const tableMat = new THREE.MeshStandardMaterial({ color: 0x121622, roughness: 0.3 });
            const tableTop = new THREE.Mesh(new THREE.BoxGeometry(10.5, 0.2, 10.5), tableMat);
            tableTop.position.set(0, -0.11, 0);
            scene.add(tableTop);

            boardMeshGroup = new THREE.Group();
            piecesGroup = new THREE.Group();
            scene.add(boardMeshGroup);
            scene.add(piecesGroup);

            window.addEventListener('pointerdown', (event) => {
                if (game.turn() !== playerColor || game.game_over()) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([...boardMeshGroup.children, ...piecesGroup.children], true);

                if (intersects.length > 0) {
                    let hitObj = intersects[0].object;
                    while (hitObj && !hitObj.userData.square && hitObj.parent) {
                        hitObj = hitObj.parent;
                    }

                    const clickedSquare = hitObj ? hitObj.userData.square : null;
                    if (!clickedSquare) return;

                    if (selectedSquare === null) {
                        const piece = game.get(clickedSquare);
                        if (piece && piece.color === playerColor) {
                            selectedSquare = clickedSquare;
                            highlightMoves(selectedSquare);
                        }
                    } else {
                        const move = game.move({ from: selectedSquare, to: clickedSquare, promotion: 'q' });
                        clearHighlights();
                        selectedSquare = null;

                        if (move !== null) {
                            renderPieces();
                            updateStatus();
                            setTimeout(makeAIMove, 300);
                        }
                    }
                }
            });

            document.getElementById('btn-white').addEventListener('click', (e) => {
                playerColor = 'w';
                e.target.classList.add('btn-active');
                document.getElementById('btn-black').classList.remove('btn-active');
                resetGame();
            });

            document.getElementById('btn-black').addEventListener('click', (e) => {
                playerColor = 'b';
                e.target.classList.add('btn-active');
                document.getElementById('btn-white').classList.remove('btn-active');
                resetGame();
            });

            document.getElementById('reset-btn').addEventListener('click', resetGame);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            createBoard();
            updateCamera();
            renderPieces();
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
